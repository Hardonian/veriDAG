[package]
name = "veridag-wasm-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
veridag-protocol-types = { version = "1.0.0", path = "../protocol-types" }
veridag-capabilities = { version = "1.0.0", path = "../capabilities" }
veridag-codec = { version = "1.0.0", path = "../codec" }
thiserror.workspace = true
anyhow = { version = "1", optional = true }
wasmtime = { version = "49.0.2", optional = true, default-features = false, features = ["cranelift", "runtime", "gc", "gc-drc"] }

[features]
default = []
wasmtime = ["dep:wasmtime", "dep:anyhow"]

[dev-dependencies]
veridag-crypto = { path = "../crypto" }
wat = "1"
