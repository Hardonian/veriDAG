name: formal

on:
  push:
    branches: [main]
    paths: ["formal/**"]
  pull_request:
    paths: ["formal/**"]

jobs:
  quint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal/quint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: quint-${{ runner.os }}-${{ hashFiles('formal/quint/package-lock.json') }}
          restore-keys: quint-${{ runner.os }}-
      - run: npm ci
      - name: typecheck
        run: |
          npm exec -- quint typecheck consensus.qnt
          npm exec -- quint typecheck instance4.qnt
      - name: deterministic commit-path test (non-vacuity)
        run: npm exec -- quint test consensus_test.qnt
      - name: Agreement
        run: npm exec -- quint run instance4.qnt --invariant=Agreement --max-steps=30 --max-samples=200
      - name: Finality
        run: npm exec -- quint run instance4.qnt --invariant=Finality --max-steps=30 --max-samples=200
      - name: Integrity
        run: npm exec -- quint run instance4.qnt --invariant=Integrity --max-steps=30 --max-samples=200
