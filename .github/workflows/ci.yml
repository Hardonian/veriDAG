name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt + clippy + test + release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120
        with:
          components: rustfmt, clippy, rust-src
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace --all-features
      - name: doc
        run: cargo doc --workspace --no-deps
      # Release gate: build the optimized, stripped, panic=abort binary and
      # prove the 4-validator demo produces identical state roots. A release
      # that cannot agree across validators is not shippable.
      - name: release build
        run: cargo build --release -p veridag-node
      - name: release smoke (4-validator agreement)
        run: cargo run --release -p veridag-node -- demo 2>&1 | tee /tmp/demo.log
      - name: assert agreement
        run: |
          roots=$(grep -c "state_root=0xac049e6f" /tmp/demo.log)
          if [ "$roots" -lt 4 ]; then
            echo "FAIL: expected >=4 validators agreeing on state root"; exit 1
          fi
          echo "OK: 4 validators agree on identical state root"

  # Cross-compile sanity: the binary must build for a low-resource edge target
  # (aarch64 Linux) so universal deployment is real, not aspirational.
  cross-edge:
    name: edge target (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: install cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: build edge binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p veridag-node --target aarch64-unknown-linux-gnu

  # TypeScript SDK conformance on every PR.
  sdk-typescript:
    name: TypeScript SDK conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install & test
        run: |
          npm ci
          npm test
          npm run build
          npm run verify-package

  # Python SDK conformance on every PR.
  sdk-python:
    name: Python SDK conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install uv & run conformance
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --extra dev --locked
          uv run pytest -q
          uv build

  industry-packs:
    name: Industry pack manifests and adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.120
      - name: validate manifests
        run: python scripts/validate-industry-packs.py
      - name: test adapters
        run: cargo test -p veridag-industry

  # Verify the Next.js site builds without errors.
  site:
    name: site build verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install & build
        run: |
          npm ci
          npm run build

  solidity:
    name: Solidity tests and fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: format
        run: forge fmt --check
      - name: unit, fuzz, and invariant tests
        run: forge test -vvv

  docker-devnet:
    name: Docker devnet build, agreement, and restart recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: validate Compose configuration
        run: docker compose config --quiet
      - name: build and start validators
        run: docker compose up -d --build
      - name: soak and restart one validator
        run: python3 scripts/devnet-soak.py --duration 45 --interval 3 --restart-service node4
      - name: capture validator logs
        if: always()
        run: docker compose logs --no-color > docker-devnet.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-devnet-logs
          path: docker-devnet.log
      - name: stop validators
        if: always()
        run: docker compose down --volumes
