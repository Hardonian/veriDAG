# Canonical Veridag Rust workspace manifest. Keep a single workspace and lockfile
# at the repository root so local, CI, Docker, and release builds resolve the
# same dependency graph.

[workspace]
members = ["implementations/rust/crates/*", "implementations/rust/bins/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
version = "1.0.0"
authors = ["Veridag Protocol Contributors"]
description = "Veridag: deterministic, Byzantine-resilient, capability-secured distributed execution substrate"
repository = "https://github.com/Hardonian/veridag"
homepage = "https://veridag.dev"
keywords = ["blockchain", "consensus", "dag", "bft", "distributed-systems"]
categories = ["cryptography", "concurrency", "network-programming"]

[workspace.dependencies]
blake3 = "1.5"
sha2 = "0.11"
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
rand = "0.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util", "signal"] }
async-trait = "0.1"
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
sled = "0.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

